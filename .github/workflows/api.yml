# API — test on PRs + pushes; on push to main build+push the image and deploy to
# lily via the shared TheDevs-cz/ci ship workflow (D23 webhook — the box PULLS;
# this repo holds no SSH key, only a per-app HMAC secret).
#
# ONE HOOK, FIVE WORKFLOWS: all five *.yml callers pass the SAME `app: fotbal-fm`
# because on lily the five images land in ONE compose project sharing one
# Postgres, one Redis and one uploads volume. The path filters keep the builds
# independent; the box's deploy.sh rolls only the services whose image changed.
#
# The old post-deploy `sync-facr` job (root-SSH, ran the --from-file syncs when
# api/data/ changed) now lives in the box's deploy.sh: it hashes /app/api/data
# in the deployed image and runs the same four syncs when the hash changed.
name: API

permissions:
    contents: read
    packages: write

on:
    push:
        branches:
            - 'main'
        paths:
            - 'api/**'
            - 'packages/**'
            - 'package-lock.json'
            - '.github/workflows/api.yml'
    pull_request:
        paths:
            - 'api/**'
            - 'packages/**'
            - 'package-lock.json'
            - '.github/workflows/api.yml'

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@v6

            -   name: Setup Node.js
                uses: actions/setup-node@v6
                with:
                    node-version: '24'
                    cache: 'npm'

            -   name: Install dependencies
                run: npm ci

            -   name: Run tests
                run: npx vitest run --project api --project strapi-client

    ship:
        needs: test
        if: github.event_name == 'push'
        uses: TheDevs-cz/ci/.github/workflows/_ship.yml@v1
        secrets:
            # Passed EXPLICITLY: `secrets: inherit` cannot cross repo owners.
            DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
        with:
            app: fotbal-fm                          # hook id == /srv/<app> == compose project
            image: ghcr.io/janmikes/fotbal-fm.cz-api
            context: .
            dockerfile: api/Dockerfile
            deploy_host: lily.srv.thedevs.cz
            await_deploy: false                     # no commit-status token for this repo yet
