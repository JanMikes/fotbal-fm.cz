name: API

permissions:
    contents: read
    deployments: write
    packages: write

on:
    push:
        branches:
            - 'main'
        paths:
            - 'api/**'
            - 'packages/**'
            - 'package-lock.json'
            - '.github/workflows/api.yml'
    pull_request:
        paths:
            - 'api/**'
            - 'packages/**'
            - 'package-lock.json'
            - '.github/workflows/api.yml'

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@v6

            -   name: Setup Node.js
                uses: actions/setup-node@v6
                with:
                    node-version: '24'
                    cache: 'npm'

            -   name: Install dependencies
                run: npm ci

            -   name: Run tests
                run: npx vitest run --project api --project strapi-client

    docker-image:
        runs-on: ubuntu-latest
        needs:
            - test
        if: github.event_name != 'pull_request'
        steps:
            -   name: Checkout
                uses: actions/checkout@v6

            -   name: Docker meta
                id: meta
                uses: docker/metadata-action@v5
                with:
                    images: |
                        ghcr.io/janmikes/fotbal-fm.cz-api
                    tags: |
                        type=ref,event=branch
                        type=ref,event=pr

            -   name: Set up Docker Buildx
                uses: docker/setup-buildx-action@v3

            -   name: Login to GHCR
                uses: docker/login-action@v3
                with:
                    registry: ghcr.io
                    username: ${{ github.repository_owner }}
                    password: ${{ secrets.GITHUB_TOKEN }}

            -   name: Build and push API
                uses: docker/build-push-action@v6
                with:
                    context: .
                    file: ./api/Dockerfile
                    push: true
                    tags: ${{ steps.meta.outputs.tags }}
                    labels: ${{ steps.meta.outputs.labels }}
                    provenance: false
                    sbom: false
                    cache-from: type=registry,ref=ghcr.io/janmikes/fotbal-fm.cz-api:cache
                    cache-to: type=registry,ref=ghcr.io/janmikes/fotbal-fm.cz-api:cache,mode=max,oci-mediatypes=true,compression=zstd,force-compression=true,ignore-error=true

    deploy:
        runs-on: ubuntu-latest
        needs:
            - docker-image
        steps:
            - name: executing remote ssh commands using ssh key
              uses: appleboy/ssh-action@v1
              with:
                host: fotbal-fm.thedevs.cz
                username: ${{ secrets.DEPLOY_USERNAME }}
                key: ${{ secrets.DEPLOY_PRIVATE_KEY }}
                script: cd /deployment/fotbal-fm-web && ./deploy-api.sh

    sync-facr:
        runs-on: ubuntu-latest
        needs:
            - deploy
        steps:
            -   name: Checkout
                uses: actions/checkout@v6
                with:
                    fetch-depth: 2

            -   name: Check if data files changed
                id: changes
                run: |
                    if git diff --name-only HEAD~1 HEAD | grep -q '^api/data/'; then
                      echo "data_changed=true" >> $GITHUB_OUTPUT
                    else
                      echo "data_changed=false" >> $GITHUB_OUTPUT
                    fi

            -   name: Sync FAČR data to Strapi
                if: steps.changes.outputs.data_changed == 'true'
                uses: appleboy/ssh-action@v1
                with:
                    host: fotbal-fm.thedevs.cz
                    username: ${{ secrets.DEPLOY_USERNAME }}
                    key: ${{ secrets.DEPLOY_PRIVATE_KEY }}
                    command_timeout: 10m
                    script: |
                        cd /deployment/fotbal-fm-web
                        docker compose exec -T api npx tsx src/cli/sync-tournaments.ts --from-file
                        docker compose exec -T api npx tsx src/cli/sync-matches.ts --from-file
                        docker compose exec -T api npx tsx src/cli/sync-standings.ts --from-file
                        docker compose exec -T api npx tsx src/cli/sync-sportbm-players.ts --from-file
