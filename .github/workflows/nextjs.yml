# https://github.com/docker/build-push-action/blob/master/docs/advanced/tags-labels.md

name: Nextjs

permissions:
    contents: read
    deployments: write
    packages: write

on:
    push:
        branches:
            - 'main'
        paths:
            - 'nextjs/**'
            - 'packages/**'
            - 'package-lock.json'
            - '.github/workflows/nextjs.yml'
    pull_request:
        paths:
            - 'nextjs/**'
            - 'packages/**'
            - 'package-lock.json'
            - '.github/workflows/nextjs.yml'

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@v6

            -   name: Setup Node.js
                uses: actions/setup-node@v6
                with:
                    node-version: '24'
                    cache: 'npm'

            -   name: Install dependencies
                run: npm ci

            -   name: Run tests
                run: npx vitest run --project nextjs --project strapi-client

    docker-image:
        runs-on: ubuntu-latest
        needs:
            - test
        if: github.event_name != 'pull_request'
        steps:
            -   name: Checkout
                uses: actions/checkout@v6

            -   name: Docker meta
                id: meta
                uses: docker/metadata-action@v5
                with:
                    # list of Docker images to use as base name for tags
                    images: |
                        ghcr.io/janmikes/fotbal-fm.cz-nextjs
                    # generate Docker tags based on the following events/attributes
                    tags: |
                        type=ref,event=branch
                        type=ref,event=pr

            -   name: Set up Docker Buildx
                uses: docker/setup-buildx-action@v3

            -   name: Login to GHCR
                uses: docker/login-action@v3
                with:
                    registry: ghcr.io
                    username: ${{ github.repository_owner }}
                    password: ${{ secrets.GITHUB_TOKEN }}

            -   name: Build and push Nextjs
                uses: docker/build-push-action@v6
                with:
                    context: .
                    file: ./nextjs/Dockerfile
                    push: true
                    tags: ${{ steps.meta.outputs.tags }}
                    labels: ${{ steps.meta.outputs.labels }}
                    provenance: false
                    sbom: false
                    cache-from: type=registry,ref=ghcr.io/janmikes/fotbal-fm.cz-nextjs:cache
                    cache-to: type=registry,ref=ghcr.io/janmikes/fotbal-fm.cz-nextjs:cache,mode=max,oci-mediatypes=true,compression=zstd,force-compression=true,ignore-error=true
                    build-args: |
                        SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
                        APP_VERSION=${{ github.sha }}
                    secrets: |
                        SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}

            -   name: Create Sentry release
                if: github.event_name != 'pull_request'
                continue-on-error: true
                uses: getsentry/action-release@v3
                env:
                    SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
                    SENTRY_ORG: thedevscz
                    SENTRY_PROJECT: fotbal-fm-nextjs
                with:
                    environment: production
                    version: ${{ github.sha }}
                    ignore_missing: true

    deploy:
        runs-on: ubuntu-latest
        needs:
            - docker-image
        steps:
            - name: executing remote ssh commands using ssh key
              uses: appleboy/ssh-action@v1
              with:
                host: fotbal-fm.thedevs.cz
                username: ${{ secrets.DEPLOY_USERNAME }}
                key: ${{ secrets.DEPLOY_PRIVATE_KEY }}
                script: cd /deployment/fotbal-fm-web && ./deploy-nextjs.sh
