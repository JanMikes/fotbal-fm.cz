# Backoffice — test on PRs + pushes; on push to main build+push the image and
# deploy to lily via the shared TheDevs-cz/ci ship workflow (D23 webhook).
# Same hook as the other four callers (`app: fotbal-fm`) — see api.yml.
#
# SENTRY_AUTH_TOKEN is passed as a BuildKit SECRET (BUILD_SECRETS), not a
# build-arg: build-args are baked into the image history and readable by anyone
# who can pull the (public) image. backoffice/Dockerfile mounts it for the
# `next build` step only.
name: Backoffice

permissions:
    contents: read
    packages: write

on:
    push:
        branches:
            - 'main'
        paths:
            - 'backoffice/**'
            - 'packages/**'
            - 'package-lock.json'
            - '.github/workflows/backoffice.yml'
    pull_request:
        paths:
            - 'backoffice/**'
            - 'packages/**'
            - 'package-lock.json'
            - '.github/workflows/backoffice.yml'

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@v6

            -   name: Setup Node.js
                uses: actions/setup-node@v6
                with:
                    node-version: '24'
                    cache: 'npm'

            -   name: Install dependencies
                run: npm ci

            -   name: Run tests
                run: npx vitest run --project backoffice --project strapi-client

    ship:
        needs: test
        if: github.event_name == 'push'
        uses: TheDevs-cz/ci/.github/workflows/_ship.yml@v1
        secrets:
            DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
            BUILD_SECRETS: |
                SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
        with:
            app: fotbal-fm
            image: ghcr.io/janmikes/fotbal-fm.cz-backoffice
            context: .
            dockerfile: backoffice/Dockerfile
            build_args: |
                APP_VERSION=${{ github.sha }}
            deploy_host: lily.srv.thedevs.cz
            await_deploy: false

    sentry-release:
        needs: ship
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        continue-on-error: true
        steps:
            -   name: Checkout
                uses: actions/checkout@v6

            -   name: Create Sentry release
                uses: getsentry/action-release@v3
                env:
                    SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
                    SENTRY_ORG: thedevscz
                    SENTRY_PROJECT: fotbal-fm-backoffice
                with:
                    environment: production
                    version: ${{ github.sha }}
                    ignore_missing: true
