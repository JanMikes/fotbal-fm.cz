# https://github.com/docker/build-push-action/blob/master/docs/advanced/tags-labels.md

name: Nginx

permissions:
    contents: read
    deployments: write
    packages: write

on:
    push:
        branches:
            - 'main'
        paths:
            - 'nginx/**'
            - '.github/workflows/nginx.yml'

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    docker-image:
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@v6

            -   name: Docker meta
                id: meta
                uses: docker/metadata-action@v5
                with:
                    # list of Docker images to use as base name for tags
                    images: |
                        ghcr.io/janmikes/fotbal-fm.cz-nginx
                    # generate Docker tags based on the following events/attributes
                    tags: |
                        type=ref,event=branch
                        type=ref,event=pr

            -   name: Set up Docker Buildx
                uses: docker/setup-buildx-action@v3

            -   name: Login to GHCR
                if: github.event_name != 'pull_request'
                uses: docker/login-action@v3
                with:
                    registry: ghcr.io
                    username: ${{ github.repository_owner }}
                    password: ${{ secrets.GITHUB_TOKEN }}

            -   name: Build and push Nginx
                uses: docker/build-push-action@v6
                with:
                    context: ./nginx
                    push: ${{ github.event_name != 'pull_request' }}
                    tags: ${{ steps.meta.outputs.tags }}
                    labels: ${{ steps.meta.outputs.labels }}
                    provenance: false
                    sbom: false
                    cache-from: type=registry,ref=ghcr.io/janmikes/fotbal-fm.cz-nginx:cache
                    cache-to: type=registry,ref=ghcr.io/janmikes/fotbal-fm.cz-nginx:cache,mode=max,oci-mediatypes=true,compression=zstd,force-compression=true,ignore-error=true

    deploy:
        runs-on: ubuntu-latest
        needs:
            - docker-image
        steps:
            - name: executing remote ssh commands using ssh key
              uses: appleboy/ssh-action@v1
              with:
                host: fotbal-fm.thedevs.cz
                username: ${{ secrets.DEPLOY_USERNAME }}
                key: ${{ secrets.DEPLOY_PRIVATE_KEY }}
                script: cd /deployment/fotbal-fm-web && ./deploy-nginx.sh
