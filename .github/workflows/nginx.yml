# Nginx (uploads CDN) — on push to main build+push the image and deploy to lily
# via the shared TheDevs-cz/ci ship workflow (D23 webhook). Same hook as the
# other four callers (`app: fotbal-fm`) — see api.yml.
name: Nginx

permissions:
    contents: read
    packages: write

on:
    push:
        branches:
            - 'main'
        paths:
            - 'nginx/**'
            - '.github/workflows/nginx.yml'

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    ship:
        uses: TheDevs-cz/ci/.github/workflows/_ship.yml@v1
        secrets:
            DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
        with:
            app: fotbal-fm
            image: ghcr.io/janmikes/fotbal-fm.cz-nginx
            context: ./nginx
            deploy_host: lily.srv.thedevs.cz
            await_deploy: false
