name: Test

permissions:
    contents: read

on:
    push:
        branches:
            - 'main'
        paths:
            - 'api/**'
            - 'nextjs/**'
            - 'presentation/**'
            - 'packages/**'
            - 'package-lock.json'
            - 'vitest.config.ts'
            - '.github/workflows/test.yml'
    pull_request:
        paths:
            - 'api/**'
            - 'nextjs/**'
            - 'presentation/**'
            - 'packages/**'
            - 'package-lock.json'
            - 'vitest.config.ts'
            - '.github/workflows/test.yml'

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@v6

            -   name: Setup Node.js
                uses: actions/setup-node@v6
                with:
                    node-version: '24'
                    cache: 'npm'

            -   name: Install dependencies
                run: npm ci

            -   name: Run tests
                run: npm test
