# Web — lint + test on PRs + pushes; on push to main build+push the image and
# deploy to lily via the shared TheDevs-cz/ci ship workflow (D23 webhook).
# Same hook as the other four callers (`app: fotbal-fm`) — see api.yml.
name: Web

permissions:
    contents: read
    packages: write

on:
    push:
        branches:
            - 'main'
        paths:
            - 'web/**'
            - 'packages/**'
            - 'package-lock.json'
            - '.github/workflows/web.yml'
    pull_request:
        paths:
            - 'web/**'
            - 'packages/**'
            - 'package-lock.json'
            - '.github/workflows/web.yml'

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@v6

            -   name: Setup Node.js
                uses: actions/setup-node@v6
                with:
                    node-version: '24'
                    cache: 'npm'

            -   name: Install dependencies
                run: npm ci

            -   name: Run lint
                run: npm run lint
                working-directory: web

    test:
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@v6

            -   name: Setup Node.js
                uses: actions/setup-node@v6
                with:
                    node-version: '24'
                    cache: 'npm'

            -   name: Install dependencies
                run: npm ci

            -   name: Run tests
                run: npx vitest run --project web --project strapi-client

    ship:
        needs:
            - lint
            - test
        if: github.event_name == 'push'
        uses: TheDevs-cz/ci/.github/workflows/_ship.yml@v1
        secrets:
            DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
        with:
            app: fotbal-fm
            image: ghcr.io/janmikes/fotbal-fm.cz-web
            context: .
            dockerfile: web/Dockerfile
            # Baked into next/image remotePatterns at build time (non-secret).
            build_args: |
                PUBLIC_UPLOADS_URL=https://static.fotbal-fm.cz
            deploy_host: lily.srv.thedevs.cz
            await_deploy: false
