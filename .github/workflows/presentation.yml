name: Presentation

permissions:
    contents: read
    deployments: write
    packages: write

on:
    push:
        branches:
            - 'main'
        paths:
            - 'presentation/**'
            - 'packages/**'
            - 'package-lock.json'
            - '.github/workflows/presentation.yml'
    pull_request:
        paths:
            - 'presentation/**'
            - 'packages/**'
            - 'package-lock.json'
            - '.github/workflows/presentation.yml'

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@v6

            -   name: Setup Node.js
                uses: actions/setup-node@v6
                with:
                    node-version: '24'
                    cache: 'npm'

            -   name: Install dependencies
                run: npm ci

            -   name: Run lint
                run: npm run lint
                working-directory: presentation

    test:
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@v6

            -   name: Setup Node.js
                uses: actions/setup-node@v6
                with:
                    node-version: '24'
                    cache: 'npm'

            -   name: Install dependencies
                run: npm ci

            -   name: Run tests
                run: npx vitest run --project presentation --project strapi-client

    docker-image:
        runs-on: ubuntu-latest
        needs:
            - lint
            - test
        if: github.event_name != 'pull_request'
        steps:
            -   name: Checkout
                uses: actions/checkout@v6

            -   name: Docker meta
                id: meta
                uses: docker/metadata-action@v5
                with:
                    images: |
                        ghcr.io/janmikes/fotbal-fm.cz-presentation
                    tags: |
                        type=ref,event=branch
                        type=ref,event=pr

            -   name: Set up Docker Buildx
                uses: docker/setup-buildx-action@v3

            -   name: Login to GHCR
                uses: docker/login-action@v3
                with:
                    registry: ghcr.io
                    username: ${{ github.repository_owner }}
                    password: ${{ secrets.GITHUB_TOKEN }}

            -   name: Build and push Presentation
                uses: docker/build-push-action@v6
                with:
                    context: .
                    file: ./presentation/Dockerfile
                    push: true
                    tags: ${{ steps.meta.outputs.tags }}
                    labels: ${{ steps.meta.outputs.labels }}
                    provenance: false
                    sbom: false
                    build-args: |
                        PUBLIC_UPLOADS_URL=https://static.fotbal-fm.cz
                    cache-from: type=registry,ref=ghcr.io/janmikes/fotbal-fm.cz-presentation:cache
                    cache-to: type=registry,ref=ghcr.io/janmikes/fotbal-fm.cz-presentation:cache,mode=max,oci-mediatypes=true,compression=zstd,force-compression=true,ignore-error=true

    deploy:
        runs-on: ubuntu-latest
        needs:
            - docker-image
        steps:
            - name: executing remote ssh commands using ssh key
              uses: appleboy/ssh-action@v1
              with:
                host: fotbal-fm.thedevs.cz
                username: ${{ secrets.DEPLOY_USERNAME }}
                key: ${{ secrets.DEPLOY_PRIVATE_KEY }}
                script: cd /deployment/fotbal-fm-web && ./deploy-presentation.sh
